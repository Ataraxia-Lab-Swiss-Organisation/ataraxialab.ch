sonar.projectKey=Ataraxia-Lab-Swiss-Organisation_ataraxialab.ch
sonar.organization=ataraxia-lab-swiss-organisation
sonar.projectName=ataraxialab.ch
sonar.host.url=https://sonarcloud.io

# Sources : HTML/CSS/JS (Nunjucks compile en HTML) + PHP (api/, cron/)
sonar.sources=src,api,cron
sonar.inclusions=**/*.html,**/*.njk,**/*.js,**/*.css,**/*.php

# Exclusions
sonar.exclusions=**/node_modules/**,**/_site/**,**/*.md,**/*.json,**/*.yml,**/*.txt

# Encodage
sonar.sourceEncoding=UTF-8

# PHP
sonar.php.version=8.1

# Coverage — pas de suite de tests (site vitrine)
sonar.coverage.exclusions=**/*

# ── Exclusions de règles globales ─────────────────────────────────────────
# S3776 JS : complexité cognitive — seuil 15 trop strict pour JS de rendu UI
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S3776
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.js

# S100 PHP : nommage snake_case intentionnel dans tout le codebase PHP
sonar.issue.ignore.multicriteria.e2.ruleKey=php:S100
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.php

sonar.projectVersion=1.0
