sonar.projectKey=Ataraxia-Lab-Swiss-Organisation_ataraxialab.ch
sonar.organization=ataraxia-lab-swiss-organisation
sonar.projectName=ataraxialab.ch
sonar.host.url=https://sonarcloud.io

# Sources : HTML/CSS/JS (Nunjucks compile en HTML) + PHP (api/, cron/)
sonar.sources=src,api,cron
sonar.inclusions=**/*.html,**/*.njk,**/*.js,**/*.css,**/*.php

# Exclusions
sonar.exclusions=**/node_modules/**,**/_site/**,**/*.md,**/*.json,**/*.yml,**/*.txt

# Encodage
sonar.sourceEncoding=UTF-8

# PHP
sonar.php.version=8.1

# Coverage — pas de suite de tests (site vitrine)
sonar.coverage.exclusions=**/*

sonar.projectVersion=1.0
