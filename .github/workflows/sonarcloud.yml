name: SonarCloud Analysis

# Analyse qualite de code SonarCloud -- projet PUBLIC ataraxialab.ch
# Stack : Eleventy (Nunjucks/HTML) + PHP (api/, cron/)
# Projet Sonar : Ataraxia-Lab-Swiss-Organisation_ataraxialab.ch
#
# Secret requis (Settings -> Secrets -> Actions) :
#   SONAR_TOKEN -- token genere par SonarCloud lors de l'onboarding

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
