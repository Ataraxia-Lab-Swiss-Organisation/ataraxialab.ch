name: SonarCloud Analysis

# Analyse qualite de code SonarCloud — projet PUBLIC ataraxialab.ch
# Stack : Eleventy (Nunjucks/HTML) + PHP (api/, cron/)
# Projet Sonar : Ataraxia-Lab-Swiss-Organisation_ataraxialab.ch
#
# Secret requis (Settings -> Secrets -> Actions) :
#   SONAR_TOKEN — token genere par SonarCloud lors de l'onboarding

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Historique complet requis pour blame et diff Sonar

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
