name: Deploy ataraxialab.ch

# Build Eleventy + déploiement SSH/rsync vers Infomaniak à chaque push sur main.
# Remplacement de FTP (SamKirkland) par rsync over SSH — différentiel, plus rapide.
#
# Compte SSH : gy877v_ataraxialab (compte maître IK) — clé ed25519 sans passphrase.
# Chemin distant : /home/clients/d70b8cc9ac817101013710f75218a5cd/sites/ataraxialab.ch/
#
# Secrets GitHub (repo Settings → Secrets → Actions) :
#   SSH_HOST        — gy877v.ftp.infomaniak.com
#   SSH_USER        — gy877v_ataraxialab
#   SSH_PRIVATE_KEY — clé privée ed25519 (ghactions_ataraxialab)
#
# Fichiers hors CI (déploiement manuel FileZilla uniquement) :
#   secrets/             — jamais versionné
#   cron-data/           — runtime IK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site (Eleventy)
        run: npx @11ty/eleventy

      - name: Smoke test — build output
        run: |
          set -e
          test -f _site/index.html
          test -f _site/confidentialite/index.html
          test -f _site/conditions/index.html
          test -f _site/contact/index.html
          grep -q "ataraxialab.ch" _site/index.html
          echo "Smoke test OK — $(find _site -name '*.html' | wc -l) pages HTML générées"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22 ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy _site/ via rsync
        run: |
          rsync -az --delete \
            --exclude='.git*' \
            --exclude='api/' \
            --exclude='cron/' \
            --exclude='secrets/' \
            --exclude='cron-data/' \
            -e "ssh -i ~/.ssh/id_ed25519 -p 22 -o StrictHostKeyChecking=no" \
            ./_site/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/clients/d70b8cc9ac817101013710f75218a5cd/sites/ataraxialab.ch/

      - name: Deploy api/ via rsync
        run: |
          rsync -az \
            --exclude='.git*' \
            -e "ssh -i ~/.ssh/id_ed25519 -p 22 -o StrictHostKeyChecking=no" \
            ./api/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/clients/d70b8cc9ac817101013710f75218a5cd/sites/ataraxialab.ch/api/

      - name: Deploy cron/ via rsync
        run: |
          rsync -az \
            --exclude='.git*' \
            -e "ssh -i ~/.ssh/id_ed25519 -p 22 -o StrictHostKeyChecking=no" \
            ./cron/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/clients/d70b8cc9ac817101013710f75218a5cd/sites/ataraxialab.ch/cron/

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
